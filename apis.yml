aid: necterotherapeutics
name: Nectero Therapeutics
description: 'Nectero Therapeutics (also operating as Nectero Medical) is a clinical-stage
  biopharmaceutical company developing a novel, minimally invasive treatment to stabilize
  growth and prevent rupture of mid-sized abdominal aortic aneurysms (AAA). Its lead
  investigational therapy is delivered as a single endovascular procedure intended
  to remodel and strengthen the aneurysm wall, offering an alternative to watchful
  waiting or open surgical repair. The company is backed by Norwest Venture Partners
  and other life-sciences investors, and maintains a corporate marketing and news
  presence. It does not publish a developer program, public API, SDKs, or any machine-readable
  API surface.'
